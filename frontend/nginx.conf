server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The app loads no third-party scripts and embeds no frames, so it can run
  # under a tight policy. 'unsafe-inline' for styles is what Vite emits.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri /index.html;
  }

  location /api {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
